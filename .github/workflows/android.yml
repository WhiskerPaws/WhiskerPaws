name: Android CI Build Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v3

    - name: Setup Java Development Kit (JDK 17)
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant Execute Permissions for Gradle
      run: chmod +x gradlew
      continue-on-error: true

    - name: Generate Gradle Wrapper
      run: gradle wrapper --gradle-version 8.1.1

    - name: Build Debug Test APK
      run: ./gradlew assembleDebug

    - name: Upload Compiled APK Asset Artifact
      uses: actions/upload-artifact@v3
      with:
        name: whiskerpaws-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
