name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Java JDK Runtime
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 🚀 NEW: This forces the cloud server to generate its own official Gradle tools, bypassing your local folders entirely!
    - name: Force Generate Pristine Gradle Tools In Cloud
      run: gradle wrapper --gradle-version 8.7

    - name: Grant Execute Permission for Gradle Wrapper
      run: chmod +x gradlew

    - name: Compile MoneyPaws Hub Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload Compiled APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MoneyPaws-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
