name: Build WhiskerPaws APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Source
        uses: actions/checkout@v4

      - name: Initialize NodeJS Execution Layer
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK Environment (LTS 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Install Application Dependency Packages
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi
          # Install core packages along with sharp for automated high-end asset imaging resizing
          npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5 sharp --legacy-peer-deps

      - name: Initialize Native Android Scaffold Blueprint
        run: |
          mkdir -p www
          cp index.html www/
          
          cat << 'INNER_EOF' > capacitor.config.json
          {
            "appId": "com.whiskerpaws.app",
            "appName": "Whisker Paws",
            "webDir": "www"
          }
          INNER_EOF
          
          npx cap add android

      - name: Inject Secure Google AdMob Core App ID Configuration
        run: |
          if [ -f app-config.json ]; then
            APPID=$(node -p "require('./app-config.json').admobAppId")
          else
            APPID="ca-app-pub-3940256099942544~3347511713"
          fi
          sed -i "s#</application>#<meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"${APPID}\"/></application>#" android/app/src/main/AndroidManifest.xml

      - name: Generate and Map Premium Mobile App Icon Assets
        run: |
          # Use an automated Node script to resize and deploy launcher icons if source image is available
          cat << 'NODE_EOF' > resize-icons.js
          const sharp = require('sharp');
          const fs = require('fs');
          const source = 'app-icon-source.png';
          
          if (fs.existsSync(source)) {
            const sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192
            };
            
            Object.entries(sizes).forEach(([folder, size]) => {
              const path = `android/app/src/main/res/${folder}`;
              if (fs.existsSync(path)) {
                sharp(source).resize(size, size).toFile(`${path}/ic_launcher.png`, (err) => {
                  if (!err) console.log(`Successfully mapped ${size}x${size} asset to ${folder}`);
                });
              }
            });
          }
          NODE_EOF
          node resize-icons.js

      - name: Execute Android Studio Debug Gradle Compilation
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Archive and Export Compiled Testing Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WhiskerPaws-Testing-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
